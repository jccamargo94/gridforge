# Local full-stack dev: api + worker + frontend, wired to your real .env /
# frontend/.env.local (DATABASE_URL points at Supabase Postgres — there is no
# local db service). Source is bind-mounted for live reload; images still
# need a rebuild if pyproject.toml/uv.lock or frontend/package.json change.
#
# Run from repo root:
#   docker compose --project-directory . --env-file .env -f docker/docker-compose.dev.yaml up --build
services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    entrypoint: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./alembic:/app/alembic
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Dockerfile.api's ENTRYPOINT already runs uvicorn; `command:` would only
    # append args after it (uvicorn invoked twice), so override the entrypoint
    # itself to add --reload.
    entrypoint: ["uv", "run", "--no-sync", "uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./services/api:/app/services/api
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./app:/app/app
      - ./services/worker:/app/services/worker
      - ./data:/app/data
    restart: unless-stopped
    # No --reload equivalent for the polling worker: after editing code,
    # `docker compose restart worker` to pick it up.

  frontend:
    # pnpm@11.8.0 (frontend/package.json packageManager) requires Node >=22.13
    # No `user:` override here: corepack enable needs root to symlink into
    # /usr/local/bin, and this service doesn't write into ./data anyway --
    # not the surface the root-owned-files problem comes from.
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
