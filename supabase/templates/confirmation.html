<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#09090b;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#09090b;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="520" cellspacing="0" cellpadding="0" style="max-width:520px;width:100%;background:#18181b;border:1px solid #27272a;border-radius:12px;">
        <tr><td style="padding:32px 32px 8px;">
          <div style="font-size:22px;font-weight:700;color:#fafafa;letter-spacing:-0.3px;">Grid<span style="color:#f59e0b;">Forge</span></div>
        </td></tr>
        <tr><td style="padding:16px 32px 0;">
          <h1 style="margin:0 0 12px;font-size:20px;color:#fafafa;">Confirma tu cuenta</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#a1a1aa;">
            Gracias por registrarte. Confirma tu correo para empezar a usar el modelo de despacho.
          </p>
        </td></tr>
        <tr><td align="center" style="padding:0 32px 24px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f59e0b;color:#0c0a09;font-weight:600;font-size:15px;text-decoration:none;padding:12px 28px;border-radius:8px;">Confirmar correo</a>
        </td></tr>
        <tr><td style="padding:0 32px 32px;">
          <p style="margin:0 0 8px;font-size:12px;color:#71717a;">Si el boton no funciona, copia este enlace en tu navegador:</p>
          <p style="margin:0;font-size:12px;word-break:break-all;"><a href="{{ .ConfirmationURL }}" style="color:#f59e0b;">{{ .ConfirmationURL }}</a></p>
        </td></tr>
        <tr><td style="padding:16px 32px;border-top:1px solid #27272a;font-size:12px;color:#71717a;">
          Si no creaste esta cuenta, ignora este mensaje.
        </td></tr>
      </table>
    </td></tr>
  </table>

</html>
