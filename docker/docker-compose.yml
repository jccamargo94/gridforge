# Run from repo root with: docker compose --project-directory . -f docker/docker-compose.yml <cmd>
# --project-directory . anchors ./data, ./.env and build contexts at the repo root
# rather than at this file's own directory (docker/).
services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    entrypoint: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
    profiles: ["backend"]
    restart: "no"

  cli:
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./data:/app/data
    command: ["run"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    profiles: ["backend"]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./data:/app/data
    profiles: ["backend"]
    restart: unless-stopped
